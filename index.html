<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Starting Point – Alex Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#9b1c21; --orange:#f7941d; --grey:#58595b; --blue:#1c219b; --light:#faf6f2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--light);}
  body{font-family:Helvetica,Arial,sans-serif;color:#2a2a2a;display:flex;justify-content:center;padding:24px 16px;}
  .card{background:#fff;max-width:600px;width:100%;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:32px 28px;border-top:6px solid var(--red);}
  h1{font-family:'Playfair Display',Georgia,serif;color:var(--red);font-size:26px;line-height:1.3;margin-bottom:12px;}
  h2{font-family:'Playfair Display',Georgia,serif;color:#1a1a1a;font-size:22px;margin:16px 0 20px;line-height:1.35;}
  p{line-height:1.55;margin-bottom:14px;}
  .sub{font-size:15px;color:var(--grey);}
  .bar{height:8px;background:#eee;border-radius:4px;margin:18px 0 6px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--orange);width:0;transition:width .3s;}
  .step{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#999;margin-bottom:4px;}
  .section-tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--blue);padding:4px 10px;border-radius:12px;margin-bottom:14px;}
  button.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e5dfd8;border-radius:10px;padding:14px 16px;font-size:16px;color:#2a2a2a;margin-bottom:10px;cursor:pointer;transition:border .15s, background .15s;font-family:inherit;line-height:1.4;}
  button.opt:hover{border-color:var(--orange);background:#fff9f2;}
  .grammar-row{display:flex;gap:10px;}
  .grammar-row button.opt{text-align:center;font-weight:700;}
  .grammar-row .yes{color:var(--blue);}
  .grammar-row .no{color:var(--red);}
  .sentence{background:var(--light);border-radius:10px;padding:16px 18px;font-size:18px;font-style:italic;color:#1a1a1a;margin-bottom:18px;line-height:1.5;}
  .btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:bold;font-size:17px;padding:14px 26px;border-radius:10px;margin:14px 8px 6px 0;}
  .btn:hover{background:#7d161a;}
  .btn.secondary{background:#fff;color:var(--grey);border:2px solid #ddd;}
  .btn.secondary:hover{background:#f5f5f5;}
  .start-btn{background:var(--red);color:#fff;border:none;font-size:18px;font-weight:bold;padding:15px 28px;border-radius:10px;cursor:pointer;margin-top:10px;font-family:inherit;}
  .start-btn:hover{background:#7d161a;}
  .badge{display:inline-block;background:var(--orange);color:#fff;font-size:12px;font-weight:bold;letter-spacing:1px;padding:4px 10px;border-radius:12px;margin-bottom:10px;}
  .free-note{font-size:14px;color:var(--grey);margin:10px 0 4px;}
  .restart{background:none;border:none;color:#999;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:18px;font-family:inherit;}
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
// ================= EDIT YOUR LINKS HERE =================
var FOUNDATIONS_LINK = "https://www.alexacademy.net/courses/learnability-foundations";
var MASTERY_LINK     = "https://www.alexacademy.net/courses/learnability-mastery";
var CHALLENGE_LINK   = "https://www.alexacademy.net/courses/one-week-fluency-course";
var CONTACT_LINK     = "https://www.alexacademy.net/private-coaching"; // TODO: swap for your WhatsApp/email link
// ==========================================================

// ---------- Section 1: simple grammar (Correct / Wrong) – catches false beginners ----------
var EASY = [
 {s:"I have been there last weekend.", correct:false},
 {s:"She work in a bank.", correct:false},
 {s:"He is a doctor.", correct:true},
 {s:"They was happy to see us.", correct:false},
 {s:"I don't like coffee.", correct:true},
 {s:"Did you saw her at work today?", correct:false}
];

// ---------- Section 2: still A2, just a step trickier – separates false beginners from A2+ ----------
var HARD = [
 {s:"London is more big than Sofia.", correct:false},
 {s:"Where you live?", correct:false},
 {s:"I am going to visit my mother next weekend.", correct:true},
 {s:"There isn't many milk in the fridge.", correct:false},
 {s:"Have you ever been to London?", correct:true},
 {s:"I live here since three years.", correct:false}
];

// ---------- Section 3: how they learn and freeze – splits Mastery vs the 7-Day Challenge ----------
// tag: f = Foundations signal, m = Mastery signal, c = Challenge signal
// Foundations answers are kept in VERY simple English – the person choosing them may be a false beginner.
var SELF = [
 {q:"Someone speaks English to you. What happens?", a:[
   {t:"I understand. I can answer.", tag:"m"},
   {t:"I understand. But I stop. The words don't come.", tag:"c"},
   {t:"I understand only a few words.", tag:"f"}]},
 {q:"How is your English now?", a:[
   {t:"It is in my head. It does not come out.", tag:"c"},
   {t:"I knew it well before. Now it is slow.", tag:"m"},
   {t:"I know very little English.", tag:"f"}]},
 {q:"What do you want most, right now?", a:[
   {t:"A fast win. This week.", tag:"c"},
   {t:"To learn from the start. Step by step.", tag:"f"},
   {t:"To keep and use the English I have.", tag:"m"}]},
 {q:"How much time can you give?", a:[
   {t:"One full week. All in.", tag:"c"},
   {t:"A little time, every day.", tag:"f"},
   {t:"One live class a week, plus some practice.", tag:"m"}]},
 {q:"You speak in a small, friendly group. How do you feel?", a:[
   {t:"Very afraid. But I know I need this.", tag:"c"},
   {t:"Afraid. I am not ready yet.", tag:"f"},
   {t:"I like that. I just don't get the chance.", tag:"m"}]},
 {q:"What stops you from speaking now?", a:[
   {t:"I know the words. But I freeze.", tag:"c"},
   {t:"I never learned the basics.", tag:"f"},
   {t:"I know English. I just don't use it. It feels asleep.", tag:"m"}]}
];

var QUESTIONS = [];
EASY.forEach(function(item){ QUESTIONS.push({type:"grammar", section:"Warm-up", item:item}); });
HARD.forEach(function(item){ QUESTIONS.push({type:"grammar", section:"Getting trickier", item:item}); });
SELF.forEach(function(item){ QUESTIONS.push({type:"self", section:"About you", item:item}); });

var RESULTS = {
 foundations:{badge:"YOUR STARTING POINT", title:"Build it properly – LearnAbility Foundations",
  body:"Starting from scratch – or lost what you had? You're not too late. We build it back, the natural way.",
  cta:"Build your foundation", link:FOUNDATIONS_LINK,
  free:"Card required, no charge for 7 days – charged from day 8 unless you cancel."},
 mastery:{badge:"YOUR STARTING POINT", title:"Wake it up – LearnAbility Mastery",
  body:"You had it once. It's not gone – just rusty. Let's wake it up, and keep it there.",
  cta:"Get it back", link:MASTERY_LINK,
  free:"Card required, no charge for 7 days – charged from day 8 unless you cancel."},
 challenge:{badge:"YOUR STARTING POINT", title:"Get it out – the 7-Day Speaking Challenge",
  body:"You know the words. But the second you speak... nothing. Give me seven days – we'll get them out.",
  cta:"Start the 7 days", link:CHALLENGE_LINK,
  free:"One-time payment, from €17."}
};

var i=0, easyRight=0, hardRight=0, tags={f:0,m:0,c:0};
var app=document.getElementById("app");

function intro(){
 app.innerHTML='<h1>Where should YOU start?</h1>'+
 '<p class="sub">18 quick things – some grammar, some about you. No dictionaries, no swotting up. Answer honestly and I\'ll tell you exactly where to start. From George Alex, English Therapist since 1989.</p>'+
 '<button class="start-btn" onclick="show()">Start the check</button>';
}

function show(){
 if(i>=QUESTIONS.length){ return result(); }
 var Q = QUESTIONS[i];
 var pct = Math.round((i/QUESTIONS.length)*100);
 var html = '<div class="step">Question '+(i+1)+' of '+QUESTIONS.length+'</div>'
   + '<div class="bar"><i style="width:'+pct+'%"></i></div>'
   + '<span class="section-tag">'+Q.section+'</span>';

 if(Q.type==="grammar"){
   html += '<h2>Correct, or wrong?</h2>'
     + '<div class="sentence">“'+Q.item.s+'”</div>'
     + '<div class="grammar-row">'
     + '<button class="opt yes" onclick="answerGrammar(true)">Correct</button>'
     + '<button class="opt no" onclick="answerGrammar(false)">Wrong</button>'
     + '</div>';
 } else {
   html += '<h2>'+Q.item.q+'</h2>';
   Q.item.a.forEach(function(opt, idx){
     html += '<button class="opt" onclick="answerSelf(\''+opt.tag+'\')">'+opt.t+'</button>';
   });
 }
 app.innerHTML = html;
}

function answerGrammar(said){
 var Q = QUESTIONS[i].item;
 var gotItRight = (said === Q.correct);
 if(gotItRight){
   if(QUESTIONS[i].section==="Warm-up"){ easyRight++; } else { hardRight++; }
 }
 i++; show();
}

function answerSelf(tag){
 tags[tag]++;
 i++; show();
}

function result(){
 var key;
 // Struggling with the basics – clearest Foundations signal, grammar overrides everything else.
 if(easyRight<=3){
   key="foundations";
 }
 // Solid basics but the harder grammar is still shaky – borderline A2, let the self-report decide.
 else if(hardRight<=2){
   if(tags.f>=tags.m && tags.f>=tags.c){ key="foundations"; }
   else if(tags.c>tags.m){ key="challenge"; }
   else { key="mastery"; }
 }
 // Clearly A2 and up – split between a quick activation boost and the longer wake-up-and-keep-it programme.
 else {
   key = (tags.c>tags.m) ? "challenge" : "mastery";
 }

 var R=RESULTS[key];
 var html='<span class="badge">'+R.badge+'</span><h2>'+R.title+'</h2><p>'+R.body+'</p>';
 html+='<a class="btn" href="'+R.link+'">'+R.cta+' &rarr;</a>';
 html+='<a class="btn secondary" href="'+CONTACT_LINK+'">Contact me for more details</a>';
 html+='<p class="free-note">'+R.free+'</p>';
 html+='<button class="restart" onclick="restart()">Take the check again</button>';
 app.innerHTML=html;
}

function restart(){
 i=0; easyRight=0; hardRight=0; tags={f:0,m:0,c:0};
 intro();
}

intro();
</script>
</body>
</html>
